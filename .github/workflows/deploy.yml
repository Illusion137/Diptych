name: Deploy

on:
  repository_dispatch:
    types: [nero-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            artifact-suffix: linux
          - os: macos-latest
            artifact-suffix: macos
          - os: windows-latest
            artifact-suffix: windows

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout Everett
        uses: actions/checkout@v4

      - name: Download Nero release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p public/wasm
          gh release download --repo Illusion137/Nero --pattern "Nero.js" --output public/wasm/Nero.js --clobber
          gh release download --repo Illusion137/Nero --pattern "Nero.wasm" --output public/wasm/Nero.wasm --clobber
          gh release download --repo Illusion137/Nero --pattern "Nero.d.ts" --output src/Nero.d.ts --clobber
          gh release download --repo Illusion137/Nero --pattern "nero_wasm_interface.ts" --output src/nero_wasm_interface.ts --clobber

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform.artifact-suffix }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

  publish-tauri-release:
    needs: build-tauri
    runs-on: ubuntu-22.04

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Determine release tag
        id: tag
        run: |
          PAYLOAD_TAG="${{ github.event.client_payload.tag }}"
          if [ -n "$PAYLOAD_TAG" ]; then
            echo "tag=app-${PAYLOAD_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=app-v$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with all platform binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Everett ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*

  deploy-pages:
    needs: build-tauri
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Everett
        uses: actions/checkout@v4

      - name: Download Nero release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/wasm
          gh release download --repo Illusion137/Nero --pattern "Nero.js" --output public/wasm/Nero.js --clobber
          gh release download --repo Illusion137/Nero --pattern "Nero.wasm" --output public/wasm/Nero.wasm --clobber
          gh release download --repo Illusion137/Nero --pattern "Nero.d.ts" --output src/Nero.d.ts --clobber
          gh release download --repo Illusion137/Nero --pattern "nero_wasm_interface.ts" --output src/nero_wasm_interface.ts --clobber

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Build Vite bundle
        run: yarn build

      - name: Checkout GitHub Pages repo
        uses: actions/checkout@v4
        with:
          repository: Illusion137/Illusion137.github.io
          token: ${{ secrets.PAGES_PAT }}
          path: pages-repo

      - name: Sync build output into Pages repo
        run: |
          cp dist/index.html pages-repo/everett.html
          mkdir -p pages-repo/assets
          cp -r dist/assets/. pages-repo/assets/
          mkdir -p pages-repo/wasm
          cp dist/wasm/Nero.js pages-repo/wasm/Nero.js
          cp dist/wasm/Nero.wasm pages-repo/wasm/Nero.wasm

      - name: Determine deploy version
        id: version
        run: |
          PAYLOAD_TAG="${{ github.event.client_payload.tag }}"
          if [ -n "$PAYLOAD_TAG" ]; then
            echo "version=${PAYLOAD_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push Pages deploy
        working-directory: pages-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: deploy Everett ${{ steps.version.outputs.version }}" || echo "Nothing to commit"
          git push
