name: Deploy

on:
    repository_dispatch:
        types: [nero-release, nero-readme-release]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-tauri:
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'nero-release'
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - os: ubuntu-22.04
                      artifact-suffix: linux
                    - os: macos-latest
                      artifact-suffix: macos
                    - os: windows-latest
                      artifact-suffix: windows

        runs-on: ${{ matrix.platform.os }}

        steps:
            - name: Checkout Everett
              uses: actions/checkout@v4

            - name: Download Nero release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  mkdir -p public/wasm
                  gh release download --repo Illusion137/Nero --pattern "Nero.js" --output public/wasm/Nero.js --clobber
                  gh release download --repo Illusion137/Nero --pattern "Nero.wasm" --output public/wasm/Nero.wasm --clobber
                  gh release download --repo Illusion137/Nero --pattern "Nero.d.ts" --output src/Nero.d.ts --clobber
                  gh release download --repo Illusion137/Nero --pattern "nero_wasm_interface.ts" --output src/nero_wasm_interface.ts --clobber

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install Yarn
              run: npm install -g yarn

            - name: Install frontend dependencies
              run: yarn install

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install Linux system dependencies
              if: matrix.platform.os == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - name: Build Tauri app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              with:
                  args: --verbose

            - name: Upload platform artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: tauri-${{ matrix.platform.artifact-suffix }}
                  path: |
                      src-tauri/target/release/bundle/dmg/*.dmg
                      src-tauri/target/release/bundle/macos/*.app.tar.gz
                      src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
                      src-tauri/target/release/bundle/appimage/*.AppImage
                      src-tauri/target/release/bundle/appimage/*.AppImage.sig
                      src-tauri/target/release/bundle/deb/*.deb
                      src-tauri/target/release/bundle/msi/*.msi
                      src-tauri/target/release/bundle/msi/*.msi.sig
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/nsis/*.exe.sig
                  if-no-files-found: ignore

    publish-tauri-release:
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'nero-release'
        needs: build-tauri
        runs-on: ubuntu-22.04

        steps:
            - name: Download all platform artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts/

            - name: Determine release tag
              id: tag
              run: |
                  PAYLOAD_TAG="${{ github.event.client_payload.tag }}"
                  if [ -n "$PAYLOAD_TAG" ]; then
                    echo "tag=app-${PAYLOAD_TAG}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=app-v$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate update manifest (latest.json)
              run: |
                  TAG="${{ steps.tag.outputs.tag }}"
                  BASE_URL="https://github.com/Illusion137/Everett/releases/download/${TAG}"
                  PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

                  MACOS_APP=$(find artifacts -name "*.app.tar.gz" | head -1)
                  LINUX_APP=$(find artifacts -name "*.AppImage" | head -1)
                  WIN_APP=$(find artifacts -name "*.msi" | head -1)

                  MACOS_SIG=""
                  LINUX_SIG=""
                  WIN_SIG=""
                  [ -n "$MACOS_APP" ] && MACOS_SIG=$(cat "${MACOS_APP}.sig" 2>/dev/null || true)
                  [ -n "$LINUX_APP" ] && LINUX_SIG=$(cat "${LINUX_APP}.sig" 2>/dev/null || true)
                  [ -n "$WIN_APP" ] && WIN_SIG=$(cat "${WIN_APP}.sig" 2>/dev/null || true)

                  MACOS_FILE=$(basename "$MACOS_APP" 2>/dev/null || true)
                  LINUX_FILE=$(basename "$LINUX_APP" 2>/dev/null || true)
                  WIN_FILE=$(basename "$WIN_APP" 2>/dev/null || true)

                  python3 - <<PYEOF
                  import json, os
                  tag = os.environ.get("TAG", "")
                  base = os.environ.get("BASE_URL", "")
                  manifest = {
                    "version": tag,
                    "notes": "See the release page for details.",
                    "pub_date": "$PUB_DATE",
                    "platforms": {}
                  }
                  if "$MACOS_SIG" and "$MACOS_FILE":
                    entry = {"signature": "$MACOS_SIG", "url": f"{base}/$MACOS_FILE"}
                    manifest["platforms"]["darwin-aarch64"] = entry
                    manifest["platforms"]["darwin-x86_64"] = entry
                  if "$LINUX_SIG" and "$LINUX_FILE":
                    manifest["platforms"]["linux-x86_64"] = {"signature": "$LINUX_SIG", "url": f"{base}/$LINUX_FILE"}
                  if "$WIN_SIG" and "$WIN_FILE":
                    manifest["platforms"]["windows-x86_64"] = {"signature": "$WIN_SIG", "url": f"{base}/$WIN_FILE"}
                  with open("latest.json", "w") as f:
                    json.dump(manifest, f, indent=2)
                  print("Generated latest.json")
                  PYEOF
              env:
                  TAG: ${{ steps.tag.outputs.tag }}
                  BASE_URL: https://github.com/Illusion137/Everett/releases/download/${{ steps.tag.outputs.tag }}

            - name: Create GitHub Release with all platform binaries
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: Everett ${{ steps.tag.outputs.tag }}
                  files: |
                      artifacts/**/*
                      latest.json

    deploy-pages:
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'nero-release'
        needs: build-tauri
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout Everett
              uses: actions/checkout@v4

            - name: Download Nero release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir -p public/wasm
                  gh release download --repo Illusion137/Nero --pattern "Nero.js" --output public/wasm/Nero.js --clobber
                  gh release download --repo Illusion137/Nero --pattern "Nero.wasm" --output public/wasm/Nero.wasm --clobber
                  gh release download --repo Illusion137/Nero --pattern "Nero.d.ts" --output src/Nero.d.ts --clobber
                  gh release download --repo Illusion137/Nero --pattern "nero_wasm_interface.ts" --output src/nero_wasm_interface.ts --clobber
                  gh release download --repo Illusion137/Nero --pattern "README.md" --output nero_README.md --clobber || \
                    curl -sf https://raw.githubusercontent.com/Illusion137/Nero/main/README.md -o nero_README.md

            - name: Sync README sections from Nero
              run: |
                  python3 scripts/sync_readme_sections.py nero_README.md README.md \
                    --sections CONSTANTS FUNCTIONS

            - name: Commit synced README
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git diff --cached --quiet || git commit -m "chore: sync constants and functions from Nero ${{ github.event.client_payload.tag }}"
                  git push

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install Yarn
              run: npm install -g yarn

            - name: Install dependencies
              run: yarn install

            - name: Build Vite bundle
              run: yarn build

            - name: Checkout GitHub Pages repo
              uses: actions/checkout@v4
              with:
                  repository: Illusion137/Illusion137.github.io
                  token: ${{ secrets.PORTFOLIO_PAT }}
                  path: pages-repo

            - name: Sync build output into Pages repo
              run: |
                  cp dist/index.html pages-repo/everett.html
                  mkdir -p pages-repo/assets
                  cp -r dist/assets/. pages-repo/assets/
                  mkdir -p pages-repo/wasm
                  cp dist/wasm/Nero.js pages-repo/wasm/Nero.js
                  cp dist/wasm/Nero.wasm pages-repo/wasm/Nero.wasm

            - name: Determine deploy version
              id: version
              run: |
                  PAYLOAD_TAG="${{ github.event.client_payload.tag }}"
                  if [ -n "$PAYLOAD_TAG" ]; then
                    echo "version=${PAYLOAD_TAG}" >> "$GITHUB_OUTPUT"
                  else
                    echo "version=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit and push Pages deploy
              working-directory: pages-repo
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "chore: deploy Everett ${{ steps.version.outputs.version }}" || echo "Nothing to commit"
                  git push

    sync-readme:
        if: github.event.action == 'nero-readme-release'
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout Everett
              uses: actions/checkout@v4

            - name: Download Nero README
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release download --repo Illusion137/Nero --pattern "README.md" --output nero_README.md --clobber || \
                    curl -sf https://raw.githubusercontent.com/Illusion137/Nero/main/README.md -o nero_README.md

            - name: Sync README sections from Nero
              run: |
                  python3 scripts/sync_readme_sections.py nero_README.md README.md \
                    --sections CONSTANTS FUNCTIONS

            - name: Commit synced README
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git diff --cached --quiet || git commit -m "chore: sync constants and functions from Nero ${{ github.event.client_payload.tag }}"
                  git push
